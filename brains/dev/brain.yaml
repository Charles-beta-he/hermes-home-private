id: dev
name: Development Brain Overlay
version: 0.3.2
status: active-baseline
updated_at: 2026-05-26T01:45:19+0800
inherits: base
purpose: "Senior software engineering execution brain for frontend/backend/admin/fullstack/contract/devops/ui-ux delivery, with project-profile grounding, taskpool handoff contracts, red-line preservation, and evidence-first verification. Also acts as cross-brain engineering enablement: when main/research/design/media/workflow/mlops identifies a missing tool, connector, browser harness, API/MCP bridge, test harness, or delivery gap, dev implements, wires, tests, documents, and hands the capability back to the requesting brain."
capabilities:
  - software_engineering_execution
  - project_profile_grounding
  - contract_aware_delivery
  - evidence_first_verification
  - taskpool_worker_handoff
  - browser_harness_validation
  - external_repo_absorption
  - source_validation_before_adoption
  - local_first_static_app_delivery
  - design_manual_consumption
  - web_research_strategy
  - media_tool_evaluation
  - external_source_registry
  - cross_brain_development_enablement
  - capability_gap_closure
  - general_query_full_coverage
  - associated_surface_mapping
  - source_to_sink_query_grounding
  - machine_readable_automation_contracts
  - version_matched_tool_workflow_loading
  - sandbox_first_experimental_tooling
  - typed_repair_plan_governance
  - provenance_fixture_coverage_matrix
  - optimization_budget_readiness_artifacts

profiles:
  frontend:
    owns:
      - SPA/H5 routes, forms, state, API client integration, build/type/lint contracts
      - visible behavior, entry preservation, responsive desktop/mobile verification
    required_inputs:
      - repo_path
      - package_manager
      - route_or_component_scope
      - api_contract_source
      - protected_entries
    verification_defaults:
      - lint_or_typecheck
      - unit_or_component_tests_when_available
      - production_build
      - browser_harness:desktop_1280
      - browser_harness:mobile_375_when_h5_or_responsive_touched
    escalation_triggers:
      - api_schema_or_dto_change
      - shared_state_or_access_flow_change
      - route_entry_removal_or_rename
  backend:
    owns:
      - controllers, services, domain logic, persistence, API contracts, migrations, integration tests
    required_inputs:
      - repo_path
      - runtime_version
      - api_contract_source
      - database_and_migration_system
      - access_permission_model
    verification_defaults:
      - targeted_unit_tests
      - integration_or_controller_contract_tests
      - migration_inspection_when_entity_field_changes
      - controller_service_domain_test_chain_evidence
    escalation_triggers:
      - entity_field_or_schema_change
      - access_permission_payment_or_funds_surface
      - public_api_compatibility_change
  fullstack:
    owns:
      - FE/BE contract reconciliation, end-to-end behavior, dependency order, final integration evidence
    required_inputs:
      - frontend_profile_ref
      - backend_profile_ref
      - contract_diff
      - integration_owner
    verification_defaults:
      - backend_contract_tests
      - frontend_build_and_smoke
      - real_or_representative_api_smoke
      - integration_handoff_summary
    escalation_triggers:
      - shared DTO/schema changes
      - cross-repo release sequencing
  contract:
    owns:
      - OpenAPI/DTO/schema/client-server compatibility, backward compatibility checks, generated client impacts
    verification_defaults:
      - schema_diff
      - backward_compatibility_review
      - consumer_impact_check
      - generated_artifact_check_when_applicable
  devops:
    owns:
      - project-local CI/build/deploy/config/container/runtime compatibility and rollback notes
    verification_defaults:
      - config_diff_review
      - dry_run_or_local_smoke_when_available
      - no_private_runtime_leakage_check
      - rollback_path_documented
  ui_ux:
    owns:
      - visual polish, responsive layout, accessibility, design variables, motion/performance-sensitive UI
    verification_defaults:
      - browser_harness:desktop_1280
      - browser_harness:mobile_375
      - accessibility_keyboard_focus_check_when_interactive
      - visual_regression_notes
  admin:
    owns:
      - admin routes, permissioned forms/tables, CRUD flows, data display consistency
    verification_defaults:
      - route_permission_check
      - table_form_data_flow_smoke
      - frontend_build
  query_full_coverage:
    owns:
      - project/code/product/document queries where the named object is only an entry point, not the boundary
      - associated-surface discovery across docs/prototypes/current FE/current BE/routes/permissions/KPIs/tests/runtime evidence
      - source-to-sink classification for pages, fields, statuses, actions, APIs, routes, workflows, metrics, permissions, and bug symptoms
    required_inputs:
      - queried_object_or_symptom
      - repository_or_project_profile_context
      - canonical_doc_or_absence_reason
      - risk_level_or_narrow_lookup_override
    verification_defaults:
      - associated_surface_map_built_or_uncovered_surfaces_declared
      - producers_transformers_consumers_entries_permissions_metrics_tests_classified
      - canonical_source_and_current_implementation_anchors
      - falsifier_or_runtime_test_for_high_risk_claims
    stop_conditions:
      - answering_from_named_file_only_when_related_modules_can_change_truth
      - KPI_badge_count_claim_without_detail_queue_or_list_predicate_comparison
      - route_absence_claim_based_only_on_sidebar_without_route_table_or_direct_url_permission_check
      - fallback_or_default_treated_as_source_of_truth_without_producer_backend_contract
  qa_verification:
    owns:
      - independent reproduction, evidence bundle review, regression-risk challenge, acceptance proof
    verification_defaults:
      - reproduce_or_readback_claim
      - verify_commands_ran
      - inspect_changed_files_against_red_lines
      - final_evidence_packet_review
  integration_owner:
    owns:
      - merge coherence, dependency order, shared contracts, final done evidence, rollback coordination
    required_when:
      - api_schema_changed
      - db_migration_changed
      - shared_ui_variables_changed
      - access_or_permission_changed
      - ci_or_deploy_config_changed

  external_repo_absorption:
    owns:
      - external GitHub/repository/documentation analysis that must become Hermes capability deltas, not generic summaries
      - repo surface discovery, mechanism extraction, Hermes gap mapping, adopt/defer/reject decisions, and minimal verifiable slices
    required_inputs:
      - repo_url_or_source_url
      - canonical_source_identity
      - repo_metadata_or_source_metadata
      - license_or_usage_boundary
      - maintenance_status
      - current_hermes_baseline
      - target_capability_delta
      - anti_drift_focus
    verification_defaults:
      - canonical_source_verified
      - README_or_docs_mechanism_evidence
      - source_surface_scan
      - gap_map_against_current_hermes
      - adopt_defer_reject_decision
      - minimal_verifiable_slice
      - landing_surface_and_execution_order
    stop_conditions:
      - source_unverified_or_404
      - license_unknown_for_install_or_distribution
      - task_degrades_into_generic_tool_summary
      - no_clear_hermes_capability_delta
  source_validation:
    owns:
      - provenance, source-integrity, license, model-weight, binary, and privacy validation before adopting external tools
    required_inputs:
      - claimed_project_name
      - claimed_url_or_package
      - canonical_url_candidates
      - license_source
      - install_surface
      - sensitive_data_surface
    verification_defaults:
      - github_or_registry_api_check
      - canonical_url_or_invalid_source_recorded
      - license_and_release_status_checked
      - installation_risk_declared
      - privacy_and_private_runtime_boundary_declared
    stop_conditions:
      - canonical_source_missing
      - repo_or_package_404_without_replacement
      - untrusted_binary_or_model_weights_required
      - privacy_sensitive_upload_required_without_user_consent

  machine_readable_automation_contract:
    owns:
      - Hermes-owned or adopted CLI/script/tool surfaces that agents will consume programmatically
      - JSON/schemaVersion contracts, required fields, stable diagnostic codes, deterministic outputs, and ANSI-free machine output
      - contract snapshot tests for check/graph/plan/fix/status/report style commands
    required_inputs:
      - command_or_tool_path
      - consumer_agent_or_brain
      - expected_output_format
      - schema_or_contract_version
      - required_fields
      - failure_output_shape
      - deterministic_fixture_or_replay_input
    verification_defaults:
      - command_run_with_machine_readable_flag_when_available
      - schemaVersion_or_contract_version_asserted
      - required_fields_asserted
      - failure_case_snapshot_asserted
      - no_ansi_or_prose_only_machine_output
      - deterministic_replay_or_fixture_checked
    stop_conditions:
      - agent_consumes_prose_when_json_or_structured_output_exists
      - command_contract_claim_without_snapshot_or_readback
      - schema_or_required_field_change_without_consumer_impact_review
  version_matched_tool_workflow:
    owns:
      - tools that ship their own version-specific workflow, language, diagnostics, or capability guidance
      - choosing the exact binary/environment that will execute the project before loading its help, skills, schemas, or contracts
      - preventing stale static documentation from overriding current tool-emitted contracts
    required_inputs:
      - tool_binary_or_entrypoint
      - version_command
      - workflow_discovery_command_or_absence_reason
      - project_runtime_context
      - static_docs_fallback_boundary
    verification_defaults:
      - binary_version_recorded
      - workflow_help_or_schema_loaded_from_same_binary_when_available
      - static_docs_marked_secondary_when_tool_contract_exists
      - mismatch_between_global_and_repo_local_binary_checked
    stop_conditions:
      - global_tool_used_for_repo_local_tool_task_without_version_check
      - static_docs_used_as_accessority_when_current_binary_exposes_contracts
  sandboxed_experimental_tooling:
    owns:
      - experimental compilers, unfamiliar CLIs, generated artifacts, benchmarks, evals, and untrusted examples
      - default disposable workspace and explicit opt-in for host-affecting local artifact tests
      - filesystem/network/environment/process side-effect boundary review
    required_inputs:
      - tool_or_repo_source
      - trust_status
      - generated_artifact_paths
      - side_effects_expected
      - local_execution_opt_in_or_sandbox_plan
    verification_defaults:
      - isolated_or_disposable_workspace_used
      - host_affecting_commands_identified
      - private_access_and_private_inputs_excluded
      - explicit_local_opt_in_for_artifact_emitting_tests
      - cleanup_or_artifact_boundary_declared
    stop_conditions:
      - production_or_sensitive_data_used_with_experimental_tool
      - untrusted_tool_run_outside_disposable_workspace_without_explicit_reason
      - generated_artifact_treated_as_trusted_without_review
  repair_provenance_optimization:
    owns:
      - auto-fix or repair proposals, provenance/coverage claims, and optimization/readiness claims for development tooling
      - safety labels for proposed edits, provenance matrices that connect owners to fixtures, and budget/readiness reports for performance/size/resource claims
    required_inputs:
      - diagnostic_or_issue_id
      - proposed_repair_plan
      - safety_label
      - evidence_fixture_or_repro
      - affected_owner_or_surface
      - optimization_budget_or_readiness_metric_when_applicable
    verification_defaults:
      - repair_plan_is_plan_first_unless_user_approves_apply
      - safety_label_checked_before_auto_apply
      - provenance_owner_to_fixture_mapping_checked_for_nontrivial_claims
      - optimization_or_readiness_claim_has_budget_report_or_measurement
      - behavior_preserving_claim_retested_after_patch
    stop_conditions:
      - fix_applied_without_diagnostic_id_or_safety_label
      - provenance_claim_without_owner_fixture_mapping
      - optimization_claim_without_before_after_metric_or_budget_artifact
  local_first_static_app:
    owns:
      - deterministic local-first static web apps derived from canonical Markdown/JSON/SQLite data
      - export model contracts, offline file:// behavior, dashboard state provenance, and browser QA
    required_inputs:
      - canonical_data_sources
      - export_command_and_schema
      - app_source_path
      - dist_output_path
      - offline_runtime_constraints
      - browser_breakpoints
    verification_defaults:
      - export_schema_validation
      - package_test_or_typecheck
      - production_build
      - file_url_offline_smoke
      - browser_harness:desktop_1280
      - browser_harness:mobile_375
      - browser_console_zero_error
      - dashboard_state_provenance_check
    stop_conditions:
      - derived_app_becomes_source_of_truth
      - mock_runtime_state_presented_as_real
      - remote_cdn_or_saas_runtime_required
      - canvas_or_three_without_dom_fallback
  design_manual_consumption:
    owns:
      - project-level DESIGN.md/design-manual intake before UI generation or UI refactor work
      - brand, component, layout-density, variable, motion, and accessibility rule propagation into implementation prompts
    required_inputs:
      - project_design_manual_path_or_absence_reason
      - brand_voice_and_visual_rules
      - design_variable_source
      - component_usage_rules
      - responsive_layout_rules
      - accessibility_rules
    verification_defaults:
      - design_manual_loaded_or_absence_declared
      - baseline_ui_conflict_check
      - ckm_design_system_conflict_check
      - screenshot_or_browser_evidence_against_manual
      - no_existing_ui_red_line_downgrade
    stop_conditions:
      - design_rules_conflict_without_resolution
      - UI_generation_without_profile_or_manual_check
      - brand_or_variable_rules_replaced_by_generic_defaults
  web_research_and_browser_automation:
    owns:
      - web/source retrieval strategy for static docs, dynamic pages, access-gated or interaction-heavy pages, and repeated site workflows
    required_inputs:
      - source_url
      - expected_content_shape
      - static_vs_dynamic_assumption
      - interaction_or_login_requirement
      - citation_requirement
    verification_defaults:
      - correct_channel_selected
      - source_url_cited
      - dynamic_content_confirmed_when_relevant
      - browser_console_or_network_errors_checked_when_interactive
      - repeated_site_pattern_considered_for_skill
    stop_conditions:
      - curl_or_static_fetch_used_for_dynamic_only_content_without_verification
      - browser_claim_without_visible_or_dom_evidence
      - uncited_current_fact
  media_tool_evaluation:
    owns:
      - media/voice/video tool adoption analysis with local dependency, model-weight, privacy, and automation-surface review
    required_inputs:
      - tool_source
      - media_capabilities_claimed
      - license
      - local_dependency_cost
      - model_weight_source
      - input_output_formats
      - privacy_boundary
    verification_defaults:
      - source_validation_completed
      - install_cost_and_runtime_requirements_declared
      - model_weight_and_license_checked
      - CLI_or_API_automation_surface_checked
      - no_quality_claim_without_test_sample_or_explicit_boundary
    stop_conditions:
      - unverified_model_weights
      - privacy_sensitive_media_upload_without_consent
      - marketing_claims_repeated_as_verified_results
  external_source_registry:
    owns:
      - reusable external data source candidates, freshness, quota, reliability, access requirements, provenance, and fallback mapping
    required_inputs:
      - source_name
      - source_domain
      - access_requirement
      - freshness_requirement
      - reliability_signal
      - quota_or_rate_limit
      - fallback_source
    verification_defaults:
      - source_metadata_recorded
      - freshness_and_access_boundary_declared
      - reliability_or_maintenance_signal_checked
      - fallback_and_citation_path_present
    stop_conditions:
      - source_added_without_provenance
      - stale_or_unversioned_docs_used_for_coding_without_current_check
  cross_brain_development_enablement:
    owns:
      - engineering enablement requests from main/research/design/media/workflow/mlops brains when their primary task is blocked by a missing implementation capability
      - scripts, CLIs, browser harnesses, API connectors, MCP/tool bridges, test harnesses, data exporters, adapters, and packaging needed for another brain to continue its original mission
      - handback contracts that return verified usage instructions, smoke evidence, failure boundaries, and ownership notes to the requesting brain
    required_inputs:
      - requesting_brain
      - original_task_or_goal
      - requested_capability_gap
      - target_repo_or_tool_surface
      - deliverable_type
      - acceptance_smoke
      - return_to_brain
      - reusable_or_oneoff
    verification_defaults:
      - implementation_or_connector_created
      - targeted_unit_or_smoke_test
      - end_to_end_usage_probe_when_possible
      - no_private_runtime_or_runtime_state_leakage_check
      - handback_usage_contract_written
      - requesting_brain_can_resume_original_task
    stop_conditions:
      - requesting_brain_goal_unclear
      - missing_write_scope_or_repo_path_for_code_change
      - capability_requires_private_access_material_or_sensitive_upload_without_user_consent
      - delivery_would_replace_domain_judgment_of_requesting_brain
    handback_contract:
      required_output:
        - delivered_artifact_path_or_command
        - invocation_example
        - verification_commands_and_results
        - known_limits_and_failure_modes
        - return_to_brain
        - next_step_for_requesting_brain

red_lines:
  - no_feature_entry_field_loss
  - no_precision_validation_security_downgrade
  - no_h5_or_mobile_regression
  - backend_field_change_requires_flyway_and_prod_confirmation
  - backend_must_cover_controller_service_domain_test_chain
  - project_code_not_pushed_by_default
  - no_unverified_access_payment_funds_or_permission_changes
  - no_runtime_or_private_runtime_artifacts_in_git
  - no_agent_consumed_prose_when_structured_contract_exists
  - no_auto_repair_without_diagnostic_id_safety_label_and_retest
  - preserve_existing_user_visible_behavior_unless_explicitly_changed

project_profile_policy:
  required_before_implementation:
    - repo_path
    - stack_and_runtime
    - package_manager_or_build_tool
    - test_commands
    - build_commands
    - deploy_target_if_relevant
    - database_and_migration_system_if_relevant
    - api_schema_or_contract_source_if_relevant
    - protected_entries_routes_fields
    - access_permission_model_if_relevant
    - h5_mobile_surfaces_if_relevant
    - browser_breakpoints
    - rollback_path
    - forbidden_side_effects
  fallback_allowed_when:
    - user_explicitly_requests_small_read_only_analysis
    - task_is_documentation_only
  fail_closed_when_missing:
    - write_operation_without_repo_path
    - backend_change_without_migration_policy
    - ui_h5_change_without_browser_verification_plan

taskpool_contract:
  required_fields:
    - task_id
    - brain
    - task_type
    - profile
    - target_surface
    - repo_path
    - project_profile_ref
    - affected_layers
    - affected_files_or_globs
    - protected_entries
    - schema_or_contract_touched
    - db_migration_touched
    - h5_risk
    - ui_breakpoints
    - access_or_permission_touched
    - deploy_or_ci_touched
    - verification_contract
    - evidence_required
    - machine_readable_contract_when_agent_consumed
    - repair_safety_label_when_auto_fix_proposed
    - sandbox_boundary_when_experimental_tooling
    - rollback_notes
    - owner
    - dependencies
    - parallel_group
    - integration_owner_required
    - done_definition
    - requesting_brain_when_cross_brain_enablement
    - requested_capability_gap_when_cross_brain_enablement
    - return_to_brain_when_cross_brain_enablement
  recommended_frontmatter_defaults:
    brain: dev
    lane: work
    completion_gate: evidence-reviewed-done
    permission_tier: budget-handoff
  done_definition:
    - changed_files_summarized
    - behavior_delta_explicit
    - red_lines_checked
    - verification_contract_satisfied_or_gap_declared
    - rollback_notes_present
    - cross_brain_capability_delivered_and_handback_ready_when_applicable

worker_handoff:
  required_context:
    - active_profile
    - project_profile_summary
    - user_red_lines
    - taskpool_contract_fields
    - files_and_surfaces_in_scope
    - files_and_surfaces_out_of_scope
    - verification_contract
    - dependency_order
    - parallel_boundary
  required_output:
    - changed_files
    - behavior_delta
    - compatibility_notes
    - contract_or_schema_diff
    - migration_notes
    - commands_run
    - verification_results
    - browser_harness_evidence
    - risk_residuals
    - assumptions
    - unresolved_questions
    - rollback_instructions
    - next_owner_instructions
  stop_conditions:
    - missing_project_profile_for_write_task
    - red_line_conflict_detected
    - schema_or_migration_uncertainty_without_user_or_prod_evidence
    - verification_command_unavailable_without_declared_alternative

verification_matrix:
  frontend:
    - inspect_git_status_first
    - lint_or_typecheck
    - relevant_unit_or_component_tests
    - production_build
    - desktop_1280
    - mobile_375
    - preserve_routes_entries_fields
  backend:
    - inspect_git_status_first
    - targeted_unit_tests
    - controller_or_api_contract_tests
    - service_domain_test_evidence
    - flyway_or_migration_inspection_when_fields_change
    - prod_migration_state_confirmation_when_required
  fullstack:
    - backend_contract_tests
    - frontend_build
    - api_smoke
    - dependency_order_evidence
    - final_integration_owner_review
  contract:
    - schema_diff
    - backwards_compatibility_check
    - generated_client_server_impact_check
  devops:
    - config_diff
    - no_private_runtime_leakage_check
    - dry_run_or_local_smoke
    - rollback_path_verified
  ui_ux:
    - desktop_1280
    - mobile_375
    - keyboard_focus_when_interactive
    - accessibility_semantics_when_applicable
    - motion_performance_risk_check
  admin:
    - route_permission_check
    - table_form_data_flow_smoke
    - frontend_build
  qa_verification:
    - independent_evidence_review
    - changed_file_red_line_scan
    - acceptance_packet_readback

parallelization_policy:
  can_parallelize_when:
    - different_repos_or_disjoint_workspaces
    - disjoint_file_globs_and_no_shared_contract
    - read_only_analysis_tasks
    - qa_verification_after_implementation_snapshot
  requires_integration_owner_when:
    - api_schema_changed
    - db_migration_changed
    - shared_ui_variables_changed
    - access_or_permission_changed
    - routing_or_navigation_changed
    - shared_state_or_generated_artifacts_changed
    - ci_or_deploy_config_changed
  conflict_keys:
    - repo_path
    - affected_files_or_globs
    - api_contract_source
    - database_schema
    - access_permission_model
    - shared_design_variables

routes:
  hermes_core_code: hermes-core
  brain_overlay_schema_changes: hermes-core
  taskpool_or_multimodel_control_plane: hermes-core
  model_quorum_provider_or_router_policy: hermes-core
  external_product_code: dev
  frontend_backend_fullstack_delivery: dev
  api_contract_and_browser_harness_verification: dev
  project_ci_build_test_fixes: dev
  external_repo_absorption_or_source_validation: dev
  local_first_static_app_delivery: dev
  design_manual_guided_ui_delivery: dev
  web_research_browser_automation: dev
  media_tool_evaluation: dev
  external_source_registry_planning: dev
  cross_brain_capability_gap_closure: dev
  machine_readable_cli_contract_or_repair_plan: dev
  version_matched_tool_workflow_request: dev
  experimental_compiler_or_generated_artifact_review: dev

smoke_checks:
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "uvisa frontend H5 bugfix"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "Hermes taskpool multimodel hook change"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "analyze external GitHub repo and decide adopt or reject"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "local first React static app browser QA"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "UI implementation using project DESIGN.md"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "research brain cannot read a dynamic page; implement browser connector and hand back"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "agent-facing CLI JSON contract snapshot and repair plan safety labels"
  - python3 ~/.hermes/scripts/brainctl.py --json brains route "experimental compiler in disposable workspace with version-matched workflow"
