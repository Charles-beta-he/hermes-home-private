  creation_nudge_interval: 15
honcho: {}
timezone: ''
discord:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
  reactions: true
  channel_prompts: {}
  server_actions: ''
whatsapp: {}
telegram:
  channel_prompts: {}
slack:
  channel_prompts: {}
mattermost:
  channel_prompts: {}
approvals:
  mode: manual
  timeout: 60
  cron_mode: approve
command_allowlist:
- script execution via -e/-c flag
- shell command via -c/-lc flag
- SQL DROP
quick_commands: {}
hooks:
  post_tool_call:
  - command: ~/.hermes/agent-hooks/record-trace.sh
    matcher: read_file|write_file|patch|search_files|terminal
    timeout: 5
  - command: /Users/charles/.claude/hooks/log-route-outcome.sh
    matcher: .*
    timeout: 5
hooks_auto_accept: true
personalities: {}
security:
  allow_private_urls: false
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
cron:
  wrap_response: true
  max_parallel_jobs: null
code_execution:
  mode: project
  max_tool_calls: 50
  timeout: 300
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
network:
  force_ipv4: false
sessions:
  auto_prune: false
  retention_days: 90
  vacuum_after_prune: true
  min_interval_hours: 24
_config_version: 22
evolve:
  min_traces_for_action: 30
  min_traces_for_eval: 20
  min_real_traces_for_eval: 20
  auto_approve:
    enabled: false
    criteria:
      eval_delta_min: 0.02
      canary_clean_hours: 24
      max_risk_level: med
    guard:
      require_p0_free: true
      require_canary_pass: true
      require_human: schema_changes,mcp_config,auth_changes
  min_traces_for_rollout: 30
  canary_pct: 0.1
group_sessions_per_user: true
hermes:
  evolve:
    min_traces: 30
mcp_servers:
  filesystem:
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /Users/charles/Desktop/folder
    command: npx
    timeout: 30
  git:
    args:
    - ~/.hermes/scripts/mcp-git-server.py
    command: python3
    timeout: 30
  memory:
    args:
    - -y
    - '@modelcontextprotocol/server-memory'
    command: npx
    env:
      MEMORY_FILE_PATH: /Users/charles/.hermes/mcp-memory.json
    timeout: 30
  time:
    args:
    - mcp-server-time
    command: uvx
    timeout: 15
platform_toolsets:
  cli:
  - hermes-cli
  discord:
  - hermes-discord
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  signal:
  - hermes-signal
  slack:
  - hermes-slack
  telegram:
  - hermes-telegram
  whatsapp:
  - hermes-whatsapp
plugins:
  enabled: []
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both
smart_model_routing:
  enabled: true
  candidate_models:
  - gpt-5.4
  - claude-sonnet-4-6
  - claude-opus-4-7
  epsilon: 0.1
  min_traces_per_model: 10
streaming: null
verification:
  cross_patch:
    enabled: true
    min_patch_conf: 0.7
    producer_model: gpt-5.4
    reviewer_model: deepseek-v4-pro
    max_patches: 20
  adversarial:
    enabled: false
    max_rounds: 2
  budgets:
    per_task_usd: 2.0
    daily_usd: 15.0
  escalate_threshold: 0.5
  fusion:
    max_entropy: 0.8
  tiers:
    T0:
      producer: mimo-v2.5-pro
      reviewers: []
      arbiter: null
    T1:
      producer: mimo-v2.5-pro
      reviewers:
      - deepseek-v4-pro
      arbiter: null
    T2:
      producer: mimo-v2.5-pro
      reviewers:
      - deepseek-v4-pro
      arbiter: claude-opus-4-7
      arbiter_trigger: disagreement
    T3:
      producer: claude-opus-4-7
      reviewers:
      - mimo-v2.5-pro
      - deepseek-v4-pro
      arbiter: claude-opus-4-7
      arbiter_trigger: disagreement
claude_budget:
  enabled: true
  daily_token_limit: 250000
  weekly_token_limit: 800000
  soft_warn_threshold: 0.6
  hard_block_threshold: 0.95
  tracker_path: ~/.hermes/state/claude_budget.json
  degradation:
    T3_fallback: deepseek-v4-pro
    T2_arbiter_fallback: deepseek-v4-pro
task_classification:
  auto_classify: true
  keywords_T3:
  - architecture
  - design
  - P10
  - schema
  - system design
  - framework
  - strategy
  keywords_T2:
  - security
  - auth
  - payment
  - migration
  - production
  - critical
  - refactor
  - multi-file
  file_count_T2_threshold: 3
  user_flags:
    /arch: T3
    /verify: T2
    /3v: T2_force_arbiter
    /quick: T0
    /budget: status
pricing:
  defaults:
    currency: USD
    rate_unit: per_1m_tokens
    timezone: UTC
  schedules:
    mimo_default:
    - window: 00:00-16:00
      multiplier: 1.0
      label: peak
    - window: 16:00-24:00
      multiplier: 0.8
      label: off_peak
  models:
    mimo-v2.5-pro:
      tier: reasoning
      provider: xiaomi
      input: 2.4
      output: 9.6
      schedule_ref: mimo_default
      candidate_groups:
      - chat
      - codegen
      - reviewer
      - arbiter
    gpt-5.4:
      tier: chat
      provider: openai
      input: 5.0
      output: 20.0
      candidate_groups:
      - chat
      - codegen
      - reviewer
    claude-sonnet-4-6:
      tier: chat
      provider: anthropic
      input: 3.0
      output: 15.0
      candidate_groups:
      - chat
      - codegen
      - reviewer
    claude-opus-4-7:
      tier: reasoning
      provider: anthropic
      input: 15.0
      output: 75.0
      candidate_groups:
      - arbiter
      - hard_reasoning
    deepseek-v4-pro:
      tier: reasoning
      provider: deepseek
      input: 0.8
      output: 2.4
      cache_hit_input: 0.08
      cache_hit_output: 0.24
      promotion:
        active: true
        discount: 0.25
        label: "\u9650\u65F62.5\u6298"
        expires_at: '2026-05-05T15:59:00Z'
        promo_input: 0.2
        promo_output: 0.6
      candidate_groups:
      - reviewer
      - codegen
    deepseek-v4-flash:
      tier: chat
      provider: deepseek
      input: 0.27
      output: 1.1
      cache_hit_input: 0.027
      cache_hit_output: 0.11
      modes:
        non_thinking: deepseek-chat (deprecated alias)
        thinking: deepseek-reasoner (deprecated alias)
      candidate_groups:
      - chat
      - codegen
      - reviewer
    deepseek-v4-flash-thinking:
      tier: reasoning
      provider: deepseek
      input: 0.27
      output: 1.1
      cache_hit_input: 0.027
      cache_hit_output: 0.11
      thinking_tokens_output: 2.2
      note: "\u601D\u8003\u6A21\u5F0F \u2014 deepseek-reasoner deprecated alias"
      candidate_groups:
      - reviewer
      - arbiter
      - hard_reasoning
    gpt-4o-mini-tts:
      tier: tts
      provider: openai
      free:
        active: true
        expires_at: '2026-06-30T23:59:59Z'
        fallback_input: 0.6
        fallback_output: 1.2
      candidate_groups:
      - tts
    voxtral-mini-tts-2603:
      tier: tts
      provider: mistral
      free:
        active: true
        expires_at: '2026-06-30T23:59:59Z'
        fallback_input: 0.4
        fallback_output: 0.8
      candidate_groups:
      - tts
    neutts:
      tier: tts
      provider: neuphonic
      free:
        active: true
        expires_at: '2026-12-31T23:59:59Z'
      candidate_groups:
      - tts
eval:
  exclude_synthetic: true
  min_traces: 30
route:
  blank_input_reject: true
taskpool:
  dispatch_mode: parallel
  max_parallel_agents: 3
  handoff_archive_threshold: 100
  handoff_archive_keep: 50
  continuation_backlog_threshold: 100
