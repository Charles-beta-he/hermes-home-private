server {
    listen 80;
    server_name rokid-cn.example.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rokid-cn.example.cn;

    # Replace these with your cloud-provider certificate paths or certbot paths.
    ssl_certificate     /etc/letsencrypt/live/rokid-cn.example.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rokid-cn.example.cn/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /rokid/sse {
        proxy_pass http://127.0.0.1:8787/rokid/sse;

        # SSE requires streaming. Any buffering can make the glasses/Rizon think the
        # environment link is down because the first frame is delayed.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        send_timeout 75s;
    }
}
