<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <title>叠桥冲刺</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="叠桥冲刺游戏画面">
    <canvas id="scene"></canvas>

    <header class="hud">
      <span class="badge" id="level-badge">第 1 关 · 热身</span>
      <div class="hud-right">
        <span class="stack-chip" id="stack-chip" aria-label="当前桥板数量">
          <span class="stack-icon" aria-hidden="true"></span>
          <span id="stack-count">0</span>
        </span>
        <button class="ghost-btn" id="restart-btn" type="button" aria-label="重新开始本关">重开</button>
      </div>
    </header>

    <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>

    <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>

    <section class="overlay is-open" id="overlay" aria-labelledby="overlay-title">
      <div class="overlay-card">
        <p class="overlay-kicker" id="overlay-kicker">堆起桥板 · 冲过断路</p>
        <h1 class="overlay-title" id="overlay-title">叠桥冲刺</h1>
        <p class="overlay-copy" id="overlay-copy">第一关只是热身<br>第二关才是真本事</p>
        <button class="primary-btn" id="primary-btn" type="button">开始热身</button>
        <p class="overlay-hint" id="overlay-hint">左右拖动或用 ← → 方向键转向，吃满桥板再过沟</p>
      </div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
